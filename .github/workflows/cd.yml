name: CD

# CD de fin de sprint : se déclenche uniquement sur push vers `prod`
# (ou en manuel via workflow_dispatch pour tester sans merger).
# CI (.github/workflows/ci.yml) tourne déjà sur tous les push/PR :
# ce workflow ne fait que la validation "livrable" : le bundle prod.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

# Sur prod on ne cancel pas un run en cours (contrairement à la CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  doctor:
    name: Expo Doctor (informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Temporaire : informatif uniquement tant que les 2 checks en échec
    # ne sont pas résorbés (patch versions SDK 57 + conflit
    # @expo/vector-icons vs react-native-vector-icons).
    # Passer à bloquant (retirer continue-on-error) quand
    # `npx expo-doctor` sort en exit 0 en local.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx expo-doctor

  export:
    name: Bundle prod (expo export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Valide le bundle prod Metro + expo-router + assets.
      # Bloquant : exit 1 aujourd'hui à cause de T2
      # (@/components/Themed manquant, voir Tickets.md).
      # Ne merger vers prod que quand ce job est vert.
      - run: npx expo export -p all
