name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fichiers modifiés)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: ESLint sur les fichiers JS/TS modifiés
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1...HEAD"
          else
            RANGE="${{ github.event.before }}...HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR $RANGE -- '*.js' '*.jsx' '*.ts' '*.tsx' || true)
          if [ -z "$FILES" ]; then
            echo "Aucun fichier JS/TS modifié, lint ignoré."
            exit 0
          fi
          echo "Fichiers lintés :"
          echo "$FILES"
          # shellcheck disable=SC2086
          npx eslint $FILES

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Temporaire : informatif uniquement tant que la dette préexistante
    # n'est pas résorbée (voir Tickets.md T2-T4 puis T5 pour re-bloquer).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test
