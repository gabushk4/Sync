name: CI

on:
  push:
    branches: [main, prod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fichiers modifiés)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint sur les fichiers JS/TS modifiés
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD~1...HEAD"
          else
            RANGE="$BEFORE...HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR $RANGE -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "Aucun fichier JS/TS modifié, lint ignoré."
            exit 0
          fi
          echo "Fichiers lintés :"
          echo "$FILES"
          npx eslint $FILES

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Temporaire : informatif tant que la dette n'est pas résorbée (Tickets.md T2-T4, T5 pour re-bloquer).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Quarantaine temporaire du snapshot StyledText (Tickets.md T1).
      - run: npm run test -- --testPathIgnorePatterns "/node_modules/" "StyledText-test"

  doctor:
    name: Expo Doctor (informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Temporaire : retirer continue-on-error quand `npx expo-doctor` sort en exit 0.
    # À résoudre AVANT le build de prod (touche au natif, donc au fingerprint).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx expo-doctor

  # Release gate : ne tourne que sur les PR vers prod.
  # À mettre en check requis dans la branch protection de `prod`.
  export:
    name: Bundle prod (expo export)
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Valide le bundle prod Metro + expo-router + assets.
      # Rouge tant que T2 (@/components/Themed manquant) n'est pas corrigé.
      - run: npx expo export --platform ios --platform android